<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem ligação · Galedos Gestão</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; background: #0b1b3a; color: #fff; text-align: center; padding: 24px; }
    main { max-width: 360px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: #cbd5e1; line-height: 1.5; }
    button { margin-top: 16px; height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
      background: #fff; color: #0b1b3a; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Sem ligação à Internet</h1>
    <p>O Galedos Gestão precisa de Internet para registar entradas, serviços e fotos. Nada foi perdido: o que já estava registado continua guardado.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
